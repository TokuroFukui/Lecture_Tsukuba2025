title: "講義ページ"
description: "Jupyter NotebookとGoogle Colabのリンク"
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

feed: false
show_feed_links: false

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

sidebar:
  nav: "main"

defaults:
  - scope:
      path: ""
    values:
      layout: single
      sidebar:
        nav: "main"
      header:
        overlay_image: /assets/images/nuclfig.jpg
        overlay_filter: 0.5
