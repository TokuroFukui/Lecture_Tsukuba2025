title: "講義ページ"
description: "Jupyter NotebookとGoogle Colabのリンク"
remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-include-cache

sidebar:
  nav: "main"

defaults:
  - scope:
      path: ""
    values:
      layout: single
      sidebar:
        nav: "main"
